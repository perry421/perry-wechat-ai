[project]
name = "perry-wechat-ai"
version = "0.1.0"
description = "Perry 的 macOS 个人微信 AI 助手：只读观察、模型路由、草稿审核"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pillow>=10.0",
    # macOS 原生框架，只在 macOS 上装。CI 的 Linux runner 没有这两个包的
    # wheel，用环境标记跳过；代码里 Quartz/Vision 的导入本来就是懒加载的，
    # 在 Linux 上 import 模块不会失败（只是跑不了真实观察器）。
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
pwa = "pwa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pwa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
